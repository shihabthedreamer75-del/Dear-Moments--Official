
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Dear Moments</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #080d1c;
            color: #f8f9ff;
            font-family: 'DM Sans', sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 42px 32px;
            border: 1px solid rgba(165,180,252,.18);
            border-radius: 24px;
            background: #10182b;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .logo {
            text-align: center;
            color: #c4b5fd;
            font-size: 15px;
            letter-spacing: 2px;
            margin-bottom: 28px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-size: 34px;
            margin: 0 0 10px;
        }

        .subtitle {
            text-align: center;
            color: #a0a9c0;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .tabs {
            display: flex;
            gap: 8px;
            padding: 5px;
            margin-bottom: 25px;
            border-radius: 12px;
            background: #080d1c;
        }

        .tab {
            width: 50%;
            padding: 11px 8px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: #a0a9c0;
            font-size: 13px;
            font-weight: 600;
        }

        .tab.active {
            background: #151f36;
            color: #c4b5fd;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            color: #c4b5fd;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #293650;
            border-radius: 12px;
            outline: none;
            background: #151f36;
            color: white;
            font-size: 14px;
        }

        input:focus {
            border-color: #a5b4fc;
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg,#818cf8,#c4b5fd);
            color: #080d1c;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            min-height: 22px;
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
            color: #fca5a5;
        }

        .back-link {
            display: block;
            margin-top: 24px;
            text-align: center;
            color: #a5b4fc;
            text-decoration: none;
            font-size: 13px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <main class="login-card">

        <div class="logo">✦ DEAR MOMENTS ✦</div>

        <h1 id="heading">Welcome Back.</h1>

        <p class="subtitle" id="subtitle">
            Sign in to continue your journey.
        </p>

        <div class="tabs">

            <button type="button" class="tab active" id="loginTab">
                Sign In
            </button>

            <button type="button" class="tab" id="registerTab">
                Create Account
            </button>

        </div>

        <form id="authForm">

            <div class="form-group">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >

            </div>

            <button type="submit" class="submit-button" id="submitButton">
                Sign In
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Dear Moments
        </a>

    </main>

    <script type="module">

        import { auth } from "./firebase.js";

        import {
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            sendEmailVerification,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const LEGACY_EMAILS = [
            "shihabreza0075@gmail.com",
            "sadiaafrinruponti4@gmail.com",
            "shihabthedreamer75@gmail.com"
        ];

        const authForm = document.getElementById("authForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

        const submitButton = document.getElementById("submitButton");
        const message = document.getElementById("message");

        const loginTab = document.getElementById("loginTab");
        const registerTab = document.getElementById("registerTab");

        const heading = document.getElementById("heading");
        const subtitle = document.getElementById("subtitle");

        let currentMode = "login";
        let redirecting = false;

        function isLegacyUser(email) {
            return LEGACY_EMAILS.includes(
                (email || "").toLowerCase().trim()
            );
        }

        function showMessage(text, success = false) {
            message.textContent = text;
            message.style.color = success ? "#a5b4fc" : "#fca5a5";
        }

        function setLoading(loading, text) {
            submitButton.disabled = loading;

            if (loading) {
                submitButton.textContent = text;
            } else {
                submitButton.textContent =
                    currentMode === "login"
                        ? "Sign In"
                        : "Create Account";
            }
        }

        function switchMode(mode) {

            currentMode = mode;

            message.textContent = "";

            if (mode === "login") {

                heading.textContent = "Welcome Back.";
                subtitle.textContent =
                    "Sign in to continue your journey.";

                submitButton.textContent = "Sign In";

                passwordInput.autocomplete = "current-password";

                loginTab.classList.add("active");
                registerTab.classList.remove("active");

            } else {

                heading.textContent = "Join Dear Moments.";
                subtitle.textContent =
                    "Create your personal space for precious memories.";

                submitButton.textContent = "Create Account";

                passwordInput.autocomplete = "new-password";

                registerTab.classList.add("active");
                loginTab.classList.remove("active");

            }

        }

        loginTab.addEventListener("click", () => {
            switchMode("login");
        });

        registerTab.addEventListener("click", () => {
            switchMode("register");
        });

        // Check existing authentication
        onAuthStateChanged(auth, async (user) => {

            if (!user || redirecting) return;

            if (user.emailVerified) {

                redirecting = true;

                window.location.replace("index.html");

            }

        });

        authForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            if (redirecting) return;

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            setLoading(true, currentMode === "login"
                ? "Signing in..."
                : "Creating account..."
            );

            message.textContent = "";

            try {

                if (currentMode === "login") {

                    const result = await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                    await result.user.reload();

                    if (!result.user.emailVerified) {

                        await signOut(auth);

                        showMessage(
                            "Please verify your email before signing in. Check your inbox."
                        );

                        setLoading(false);
                        return;

                    }

                    redirecting = true;

                    showMessage("Login successful!", true);

                    window.location.replace("index.html");

                } else {

                    // New accounts cannot claim the shared space.
                    if (isLegacyUser(email)) {

                        showMessage(
                            "This email already belongs to an existing account. Please use Sign In."
                        );

                        setLoading(false);
                        return;

                    }

                    const result = await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                    await sendEmailVerification(result.user);

                    await signOut(auth);

                    showMessage(
                        "Account created! A verification email has been sent. Verify your email, then return here to sign in.",
                        true
                    );

                    authForm.reset();

                    switchMode("login");

                }

            } catch (error) {

                console.error("Authentication error:", error);

                const errorMessages = {

                    "auth/email-already-in-use":
                        "This email is already registered. Please sign in.",

                    "auth/invalid-email":
                        "Please enter a valid email address.",

                    "auth/weak-password":
                        "Password must contain at least 6 characters.",

                    "auth/invalid-credential":
                        "Incorrect email or password.",

                    "auth/user-disabled":
                        "This account has been disabled.",

                    "auth/too-many-requests":
                        "Too many attempts. Please try again later.",

                    "auth/network-request-failed":
                        "Network error. Please check your internet connection."

                };

                showMessage(
                    errorMessages[error.code] ||
                    "Something went wrong. Please try again."
                );

            }

            setLoading(false);

        });

    </script>

</body>
</html>
