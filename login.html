
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Dear Moments</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #080d1c;
            color: #f8f9ff;
            font-family: 'DM Sans', sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 42px 32px;
            border: 1px solid rgba(165,180,252,.18);
            border-radius: 24px;
            background: #10182b;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .logo {
            text-align: center;
            color: #c4b5fd;
            font-size: 15px;
            letter-spacing: 2px;
            margin-bottom: 28px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            font-size: 34px;
            margin: 0 0 10px;
        }

        .subtitle {
            text-align: center;
            color: #a0a9c0;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            color: #c4b5fd;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #293650;
            border-radius: 12px;
            outline: none;
            background: #151f36;
            color: white;
            font-size: 14px;
        }

        input:focus {
            border-color: #a5b4fc;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg,#818cf8,#c4b5fd);
            color: #080d1c;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            min-height: 22px;
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            color: #fca5a5;
        }

        .back-link {
            display: block;
            margin-top: 24px;
            text-align: center;
            color: #a5b4fc;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <main class="login-card">

        <div class="logo">✦ DEAR MOMENTS ✦</div>

        <h1>Welcome Back.</h1>

        <p class="subtitle">
            Sign in to continue your journey.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="loginButton">
                Sign In
            </button>

            <p id="message" role="status"></p>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Dear Moments
        </a>

    </main>

    <script type="module">

        import {
            initializeApp,
            getApps,
            getApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoKf2d4Do0kqKdttDec_Yu5AW-xocjxqU",
            authDomain: "dear-moments-bf2a5.firebaseapp.com",
            projectId: "dear-moments-bf2a5",
            storageBucket: "dear-moments-bf2a5.firebasestorage.app",
            messagingSenderId: "699945956834",
            appId: "1:699945956834:web:2ade64329a09b17451f5bb",
            measurementId: "G-E2MR90WZPE"
        };

        // Approved accounts
        const ALLOWED_EMAILS = [
            "shihabreza0075@gmail.com",
            "sadiaafrinruponti4@gmail.com",
            "shihabthedreamer75@gmail.com"
        ];

        const app = getApps().length
            ? getApp()
            : initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        let redirecting = false;

        function isAllowed(email) {
            return ALLOWED_EMAILS.includes(
                (email || "").toLowerCase().trim()
            );
        }

        onAuthStateChanged(auth, async (user) => {

            if (redirecting) return;

            if (!user) return;

            if (isAllowed(user.email)) {
                redirecting = true;
                window.location.replace("index.html");
            } else {
                await signOut(auth);
                message.textContent =
                    "This account is not authorized.";
            }

        });

        loginForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            if (redirecting) return;

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";
            message.textContent = "";

            try {

                if (!isAllowed(email)) {
                    throw new Error("not-approved");
                }

                const result = await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                if (!isAllowed(result.user.email)) {
                    await signOut(auth);
                    throw new Error("not-approved");
                }

                redirecting = true;
                message.style.color = "#a5b4fc";
                message.textContent = "Login successful!";

                window.location.replace("index.html");

            } catch (error) {

                console.error(error);

                message.style.color = "#fca5a5";

                if (error.message === "not-approved") {
                    message.textContent =
                        "This email is not on the approved account list.";
                } else if (
                    error.code === "auth/invalid-credential" ||
                    error.code === "auth/wrong-password" ||
                    error.code === "auth/user-not-found"
                ) {
                    message.textContent =
                        "Incorrect email or password.";
                } else {
                    message.textContent =
                        "Login failed. Please try again.";
                }

                loginButton.disabled = false;
                loginButton.textContent = "Sign In";

            }

        });

    </script>

</body>
</html>
